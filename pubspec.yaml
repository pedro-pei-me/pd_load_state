name: pd_load_state
description: Flutter插件用于网络请求状态管理，具有增强的UI设计、动画和多平台支持。可以轻松地将加载、错误、空和成功状态添加到小部件中。
version: 0.2.1
homepage: https://gitee.com/pedro-labs/
repository: https://gitee.com/pedro-labs/pd_load_state

license: MIT

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
