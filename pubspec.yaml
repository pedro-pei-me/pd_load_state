name: pd_load_state
description: Flutter plugin for request load states (loading/error/empty/success) with enhanced UI, multi-platform support and generic data carrying.
version: 1.1.0
homepage: https://gitee.com/pedro-labs/pd_load_state
repository: https://github.com/pedro-pei-me/pd_load_state
issue_tracker: https://github.com/pedro-pei-me/pd_load_state/issues

license: MIT

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=1.17.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_lints: ^2.0.0

topics:
  - state-management
  - loading
  - ui
  - flutter-plugin