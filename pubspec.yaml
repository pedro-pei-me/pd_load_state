name: pd_load_state
description: "A Flutter plugin for network request state management with enhanced UI design, animations, and multi-platform support. Easily add loading, error, empty, and success states to your widgets."
version: 0.2.1
homepage: https://gitee.com/pedro-labs/
repository: https://gitee.com/pedro-labs/pd_load_state

license: MIT

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
