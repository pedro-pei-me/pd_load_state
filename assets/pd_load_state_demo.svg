<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="emptyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9E9E9E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#607D8B;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="#f5f5f5" rx="10"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">
    PD Load State - 状态演示
  </text>
  
  <!-- 加载中状态 -->
  <g id="loadingState">
    <rect x="50" y="60" width="150" height="120" fill="url(#loadingGradient)" rx="8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.6;0.9" dur="2s" repeatCount="indefinite"/>
    </rect>
    
    <!-- 旋转的加载图标 -->
    <circle cx="125" cy="100" r="15" fill="none" stroke="white" stroke-width="3" stroke-dasharray="47" stroke-dashoffset="47">
      <animate attributeName="stroke-dashoffset" values="47;0;47" dur="1.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 125 100;360 125 100" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <text x="125" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">加载中...</text>
    <text x="125" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Loading</text>
  </g>
  
  <!-- 错误状态 -->
  <g id="errorState">
    <rect x="225" y="60" width="150" height="120" fill="url(#errorGradient)" rx="8" opacity="0.9"/>
    
    <!-- 错误图标 -->
    <circle cx="300" cy="100" r="20" fill="none" stroke="white" stroke-width="3">
      <animate attributeName="r" values="20;25;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="290" y1="90" x2="310" y2="110" stroke="white" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="310" y1="90" x2="290" y2="110" stroke="white" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
    </line>
    
    <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">加载失败</text>
    <text x="300" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Error</text>
  </g>
  
  <!-- 空数据状态 -->
  <g id="emptyState">
    <rect x="400" y="60" width="150" height="120" fill="url(#emptyGradient)" rx="8" opacity="0.9"/>
    
    <!-- 空数据图标 -->
    <rect x="465" y="85" width="20" height="30" fill="none" stroke="white" stroke-width="2" rx="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <line x1="470" y1="95" x2="480" y2="95" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="470" y1="100" x2="480" y2="100" stroke="white" stroke-width="1" opacity="0.7"/>
    <line x1="470" y1="105" x2="480" y2="105" stroke="white" stroke-width="1" opacity="0.7"/>
    
    <text x="475" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">暂无数据</text>
    <text x="475" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Empty</text>
  </g>
  
  <!-- 成功状态 -->
  <g id="successState">
    <rect x="575" y="60" width="150" height="120" fill="url(#successGradient)" rx="8" opacity="0.9"/>
    
    <!-- 成功图标 -->
    <circle cx="650" cy="100" r="20" fill="none" stroke="white" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0 126;63 63;126 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <polyline points="640,100 648,108 665,91" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 24;12 12;24 0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </polyline>
    
    <text x="650" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">加载成功</text>
    <text x="650" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Success</text>
  </g>
  
  <!-- 状态转换箭头 -->
  <g id="arrows">
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#666" />
      </marker>
    </defs>
    
    <!-- 箭头动画 -->
    <line x1="200" y1="120" x2="225" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="375" y1="120" x2="400" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="550" y1="120" x2="575" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- 底部说明 -->
  <text x="400" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">
    Flutter 加载状态管理插件 - 支持多种状态切换和自定义UI
  </text>
  
  <!-- 特性列表 -->
  <g id="features">
    <text x="50" y="290" font-family="Arial, sans-serif" font-size="14" fill="#333">✨ 特性亮点:</text>
    <text x="70" y="310" font-family="Arial, sans-serif" font-size="12" fill="#666">• 支持多种加载状态</text>
    <text x="70" y="325" font-family="Arial, sans-serif" font-size="12" fill="#666">• 增强版UI设计</text>
    <text x="70" y="340" font-family="Arial, sans-serif" font-size="12" fill="#666">• 流畅的动画效果</text>
    
    <text x="250" y="310" font-family="Arial, sans-serif" font-size="12" fill="#666">• 自定义错误重试</text>
    <text x="250" y="325" font-family="Arial, sans-serif" font-size="12" fill="#666">• 全局配置支持</text>
    <text x="250" y="340" font-family="Arial, sans-serif" font-size="12" fill="#666">• 多平台兼容</text>
    
    <text x="430" y="310" font-family="Arial, sans-serif" font-size="12" fill="#666">• 轻量级设计</text>
    <text x="430" y="325" font-family="Arial, sans-serif" font-size="12" fill="#666">• 易于集成</text>
    <text x="430" y="340" font-family="Arial, sans-serif" font-size="12" fill="#666">• 完整示例</text>
  </g>
  
  <!-- 装饰性元素 -->
  <g id="decorations">
    <circle cx="750" cy="80" r="3" fill="#4CAF50" opacity="0.6">
      <animate attributeName="r" values="3;6;3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="300" r="2" fill="#2196F3" opacity="0.5">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>